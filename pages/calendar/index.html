<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日历日程</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <div class="bg-layer" id="bg-layer" hidden></div>
      <header class="topbar">
        <button id="btn-ctx" class="pill" title="返回">‹ 2026年</button>
        <div class="spacer"></div>
        <button id="btn-view" class="icon-btn" title="切换月/日视图">🗓</button>
        <button id="btn-split" class="icon-btn" title="分栏：左月历 + 右日历">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect
              x="2.75"
              y="4.25"
              width="14.5"
              height="11.5"
              rx="2.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <rect x="4.6" y="6.1" width="3.6" height="7.8" rx="1" fill="currentColor" />
            <line
              x1="10"
              y1="4.6"
              x2="10"
              y2="15.4"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
        </button>
        <button id="btn-ai" class="icon-btn" title="AI 帮建日程">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 2.6 L11.7 8.3 L17.4 10 L11.7 11.7 L10 17.4 L8.3 11.7 L2.6 10 L8.3 8.3 Z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="1"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="btn-search" class="icon-btn" title="搜索日程">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.6" cy="8.6" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7" />
            <line
              x1="12.6"
              y1="12.6"
              x2="16.6"
              y2="16.6"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          id="btn-pos"
          class="icon-btn"
          title="面板 / 桌面小窗切换"
        >
          ⧉
        </button>
        <button id="btn-add" class="icon-btn" title="新建日程">＋</button>
        <div class="searchbox" id="searchbox" hidden>
          <input
            id="search-input"
            type="text"
            placeholder="搜索日程标题或备注…"
            autocomplete="off"
          />
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </header>

      <div class="title-row">
        <h1 class="big-title" id="big-title">十月</h1>
        <button class="year-step" id="btn-year-prev" hidden>‹</button>
        <button class="year-step" id="btn-year-next" hidden>›</button>
      </div>

      <div class="body-row">
        <div class="views">
          <div class="weekday-row" id="weekday-row">
            <span>日</span><span>一</span><span>二</span><span>三</span
            ><span>四</span><span>五</span><span>六</span>
          </div>
          <main class="view year-view" id="view-year" hidden>
            <div class="year-grid" id="year-grid"></div>
          </main>
          <main class="view" id="view-month" hidden>
            <div class="month-view" id="month-view"></div>
          </main>
          <main class="view" id="view-day" hidden>
            <div class="day-view" id="day-view"></div>
          </main>
        </div>
        <aside class="digest-aside" id="digest" hidden>
          <div class="dg-day" id="dg-day">8</div>
          <div class="dg-sub" id="dg-sub"></div>
          <ul class="dg-lines" id="dg-lines"></ul>
          <div class="dg-empty" id="dg-empty" hidden>今天暂无安排</div>
        </aside>
      </div>

      <footer class="bottombar">
        <button id="btn-today" class="pill">今天</button>
        <div class="spacer"></div>
        <button id="btn-bg" class="icon-btn" title="设置面板背景">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect
              x="2.75"
              y="4"
              width="14.5"
              height="12"
              rx="2.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle cx="7.1" cy="8.3" r="1.5" fill="currentColor" />
            <path
              d="M4.4 14.6 L8.9 10.2 L12.2 13.4 L13.7 11.9 L15.6 14.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="cal-fab-wrap">
          <div class="cal-pop" id="cal-pop" hidden></div>
          <button id="btn-cals" class="fab" title="显示的日历">☰</button>
        </div>
      </footer>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
      <form class="modal" id="ev-form">
        <h2 id="modal-title">新建日程</h2>
        <label
          >标题
          <input id="f-title" type="text" maxlength="120" required
        /></label>
        <label class="check"
          ><input id="f-allday" type="checkbox" /> 全天日程</label
        >
        <div class="row">
          <label
            >开始
            <input id="f-start" type="datetime-local" required
          /></label>
          <label
            >结束
            <input id="f-end" type="datetime-local" required
          /></label>
        </div>
        <div class="row">
          <label
            >重复
            <select id="f-repeat">
              <option value="none">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </label>
          <label
            >提醒
            <select id="f-remind">
              <option value="0">不提醒</option>
              <option value="5">提前 5 分钟</option>
              <option value="15">提前 15 分钟</option>
              <option value="30">提前 30 分钟</option>
              <option value="60">提前 1 小时</option>
            </select>
          </label>
        </div>
        <div class="colors" id="f-colors"></div>
        <label
          >备注
          <textarea id="f-note" rows="3" maxlength="2000"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="f-del" hidden>删除</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="f-cancel">取消</button>
          <button type="submit" class="btn primary" id="f-submit">添加</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="modal-backdrop" id="ai-modal" hidden>
      <div class="modal ai-modal">
        <h2>AI 建日程</h2>
        <div class="ai-msgs" id="ai-msgs">
          <div class="ai-hint">
            用自然语言描述日程，AI 会帮你创建，例如：<br />「明天下午3点到4点和张伟开会，提前15分钟提醒」
          </div>
        </div>
        <form id="ai-form">
          <div class="ai-input-row">
            <textarea
              id="ai-text"
              rows="2"
              placeholder="输入日程安排…（回车发送，Shift+回车换行）"
            ></textarea>
            <button type="submit" class="btn primary" id="ai-send">发送</button>
          </div>
        </form>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="ai-clear">清空对话</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="ai-close">关闭</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="bg-modal" hidden>
      <form class="modal" id="bg-form">
        <h2>面板背景</h2>
        <label
          >背景图片（PNG / JPEG / WebP / GIF，≤ 8MB）
          <input
            type="file"
            id="bg-file"
            accept="image/png,image/jpeg,image/webp,image/gif"
        /></label>
        <label class="bg-op-label"
          >透明度：<span id="bg-op-val">30%</span>
          <input type="range" id="bg-op" min="10" max="60" step="5" value="30"
        /></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="bg-remove" hidden>移除背景</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="bg-cancel">取消</button>
          <button type="submit" class="btn primary" id="bg-apply">应用</button>
        </div>
      </form>
    </div>

    <noscript><p class="fatal">此面板需要启用 JavaScript。</p></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
