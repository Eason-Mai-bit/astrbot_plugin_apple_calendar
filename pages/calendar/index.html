<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日历日程</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <div class="bg-layer" id="bg-layer" hidden></div>
      <header class="topbar">
        <button id="btn-ctx" class="pill" title="返回">‹ 2026年</button>
        <div class="spacer"></div>
        <button id="btn-split" class="icon-btn" title="分栏：左月历 + 右日历">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect
              x="2.75"
              y="4.25"
              width="14.5"
              height="11.5"
              rx="2.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <rect x="4.6" y="6.1" width="3.6" height="7.8" rx="1" fill="currentColor" />
            <line
              x1="10"
              y1="4.6"
              x2="10"
              y2="15.4"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
        </button>
        <button id="btn-countdown" class="icon-btn" title="倒计时">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M5.5 2.8h9M5.5 17.2h9"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              fill="none"
            />
            <path
              d="M6.8 2.8v2.2c0 1.55 3.2 3.15 3.2 5s-3.2 3.45-3.2 5v2.2M13.2 2.8v2.2c0 1.55-3.2 3.15-3.2 5s3.2 3.45 3.2 5v2.2"
              stroke="currentColor"
              stroke-width="1.4"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M8.4 12.8h3.2L10 16.2z" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-diary" class="icon-btn" title="日记">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M5.6 3.1h9.1c1.3 0 2.3 1 2.3 2.3v9.3c0 1.3-1 2.3-2.3 2.3H5.6c-1.3 0-2.3-1-2.3-2.3V5.4c0-1.3 1-2.3 2.3-2.3z"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
              stroke-linejoin="round"
            />
            <path
              d="M6.7 3.3v13.4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
            <path
              d="M9.4 7.2h4.9M9.4 10h4.9M9.4 12.8h3.2"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
        <button id="btn-ai" class="icon-btn" title="AI 帮建日程">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 2.6 L11.7 8.3 L17.4 10 L11.7 11.7 L10 17.4 L8.3 11.7 L2.6 10 L8.3 8.3 Z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="1"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="btn-search" class="icon-btn" title="搜索日程">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.6" cy="8.6" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7" />
            <line
              x1="12.6"
              y1="12.6"
              x2="16.6"
              y2="16.6"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          id="btn-pos"
          class="icon-btn"
          title="面板 / 桌面小窗切换"
        >
          ⧉
        </button>
        <button id="btn-add" class="icon-btn" title="新建日程">＋</button>
        <div class="searchbox" id="searchbox" hidden>
          <input
            id="search-input"
            type="text"
            placeholder="搜索日程标题或备注…"
            autocomplete="off"
          />
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </header>

      <div class="title-row">
        <h1 class="big-title" id="big-title">十月</h1>
        <button class="year-step" id="btn-year-prev" hidden>‹</button>
        <button class="year-step" id="btn-year-next" hidden>›</button>
      </div>

      <div class="body-row">
        <div class="views">
          <div class="weekday-row" id="weekday-row">
            <span>日</span><span>一</span><span>二</span><span>三</span
            ><span>四</span><span>五</span><span>六</span>
          </div>
          <main class="view year-view" id="view-year" hidden>
            <div class="year-grid" id="year-grid"></div>
          </main>
          <main class="view" id="view-month" hidden>
            <div class="month-view" id="month-view"></div>
          </main>
          <main class="view" id="view-day" hidden>
            <div class="day-view" id="day-view"></div>
            <div class="day-side" id="day-side" hidden></div>
          </main>
        </div>
        <main class="cd-view" id="cd-view" hidden>
          <div class="cd-head">
            <span class="unit-badge" id="cd-unit" hidden></span>
            <span class="refresh-hint" id="cd-hint"></span>
          </div>
          <div class="grid" id="cd-grid"></div>
          <div class="cd-pager">
            <button class="pill" id="cd-prev">‹ 上一页</button>
            <span class="page-ind" id="cd-ind">1 / 1</span>
            <button class="pill" id="cd-next">下一页 ›</button>
          </div>
        </main>
        <main class="diary-view" id="diary-view" hidden>
          <div class="dy-toolbar">
            <button class="pill dy-new" id="dy-new">＋ 新写日记</button>
            <input
              class="dy-search"
              id="dy-search"
              type="search"
              placeholder="搜索标题、正文或标签…"
              autocomplete="off"
            />
          </div>
          <div class="dy-tags" id="dy-tags"></div>
          <div class="dy-body">
            <div class="dy-list" id="dy-list"></div>
            <section class="dy-pane" id="dy-pane"></section>
          </div>
        </main>
      </div>

      <footer class="bottombar">
        <button id="btn-today" class="pill">今天</button>
        <div class="spacer"></div>
        <button id="btn-color" class="icon-btn" title="自定义配色">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 2.8c-4 0-7.2 3-7.2 6.9 0 3.6 2.7 6.5 6.1 6.5 1.3 0 1.9-.8 1.9-1.6 0-.9-.7-1.3-.7-2.1 0-.7.6-1.2 1.4-1.2h1.5c2.4 0 4.2-1.7 4.2-4C17.2 5 14 2.8 10 2.8z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <circle cx="6.4" cy="8.4" r="1.05" fill="currentColor" />
            <circle cx="9.6" cy="6.1" r="1.05" fill="currentColor" />
            <circle cx="13.2" cy="7.3" r="1.05" fill="currentColor" />
            <circle cx="14.4" cy="10.6" r="1.05" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-bg" class="icon-btn" title="设置面板背景">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect
              x="2.75"
              y="4"
              width="14.5"
              height="12"
              rx="2.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle cx="7.1" cy="8.3" r="1.5" fill="currentColor" />
            <path
              d="M4.4 14.6 L8.9 10.2 L12.2 13.4 L13.7 11.9 L15.6 14.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="cal-fab-wrap">
          <div class="cal-pop" id="cal-pop" hidden></div>
          <button id="btn-cals" class="fab" title="显示的日历">☰</button>
        </div>
      </footer>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
      <form class="modal" id="ev-form">
        <h2 id="modal-title">新建日程</h2>
        <label
          >标题
          <input id="f-title" type="text" maxlength="120" required
        /></label>
        <label
          >谁的日程
          <input
            id="f-owner"
            type="text"
            maxlength="32"
            placeholder="可留空，如：我、室友、全家"
            list="f-owner-list"
        /></label>
        <datalist id="f-owner-list"></datalist>
        <label class="check"
          ><input id="f-allday" type="checkbox" /> 全天日程</label
        >
        <div class="row">
          <label
            >开始
            <input id="f-start" type="datetime-local" required
          /></label>
          <label
            >结束
            <input id="f-end" type="datetime-local" required
          /></label>
        </div>
        <div class="row">
          <label
            >重复
            <select id="f-repeat">
              <option value="none">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </label>
          <label
            >提醒
            <select id="f-remind">
              <option value="0">不提醒</option>
              <option value="5">提前 5 分钟</option>
              <option value="15">提前 15 分钟</option>
              <option value="30">提前 30 分钟</option>
              <option value="60">提前 1 小时</option>
            </select>
          </label>
        </div>
        <div class="colors" id="f-colors"></div>
        <label
          >备注
          <textarea id="f-note" rows="3" maxlength="2000"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="f-del" hidden>删除</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="f-cancel">取消</button>
          <button type="submit" class="btn primary" id="f-submit">添加</button>
        </div>
      </form>
    </div>

    <div class="modal-backdrop" id="cd-modal" hidden>
      <div class="modal">
        <h2>倒计时详情</h2>
        <label
          >标题
          <input id="cd-title" type="text" readonly />
        </label>
        <label
          >时间
          <input id="cd-time" type="text" readonly />
        </label>
        <label
          >谁的日程
          <input id="cd-owner" type="text" readonly placeholder="未分配" />
        </label>
        <label
          >备注
          <textarea id="cd-note" rows="3" readonly></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cd-del">删除</button>
          <div class="spacer"></div>
          <button type="button" class="btn primary" id="cd-done">完成</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <div class="modal-backdrop" id="ai-modal" hidden>
      <div class="modal ai-modal">
        <h2>AI 建日程</h2>
        <div class="ai-msgs" id="ai-msgs">
          <div class="ai-hint">
            用自然语言描述日程，AI 会帮你创建，例如：<br />「明天下午3点到4点和张伟开会，提前15分钟提醒」
          </div>
        </div>
        <form id="ai-form">
          <div class="ai-input-row">
            <textarea
              id="ai-text"
              rows="2"
              placeholder="输入日程安排…（回车发送，Shift+回车换行）"
            ></textarea>
            <button type="submit" class="btn primary" id="ai-send">发送</button>
          </div>
        </form>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="ai-clear">清空对话</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="ai-close">关闭</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="bg-modal" hidden>
      <form class="modal" id="bg-form">
        <h2>面板背景</h2>
        <label
          >背景图片（PNG / JPEG / WebP / GIF，≤ 8MB）
          <input
            type="file"
            id="bg-file"
            accept="image/png,image/jpeg,image/webp,image/gif"
        /></label>
        <label class="bg-op-label"
          >透明度：<span id="bg-op-val">30%</span>
          <input type="range" id="bg-op" min="10" max="60" step="5" value="30"
        /></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="bg-remove" hidden>移除背景</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="bg-cancel">取消</button>
          <button type="submit" class="btn primary" id="bg-apply">应用</button>
        </div>
      </form>
    </div>

    <div class="modal-backdrop" id="color-modal" hidden>
      <form class="modal" id="color-form">
        <h2>自定义配色</h2>
        <div class="color-row">
          <span class="color-row-label">主色</span>
          <div class="color-swatches" id="sw-primary"></div>
          <input type="color" id="color-primary" value="#2563eb" />
        </div>
        <div class="color-row">
          <span class="color-row-label">辅助色</span>
          <div class="color-swatches" id="sw-secondary"></div>
          <input type="color" id="color-secondary" value="#3e6bb0" />
        </div>
        <div class="color-preview" id="color-preview" title="分类色将由辅助色派生"></div>
        <label class="color-extract"
          >从图片提取配色（PNG / JPEG / WebP / GIF，≤ 8MB）
          <input
            type="file"
            id="color-file"
            accept="image/png,image/jpeg,image/webp,image/gif"
          />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="color-reset">恢复默认</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="color-cancel">取消</button>
          <button type="submit" class="btn primary" id="color-apply">应用</button>
        </div>
      </form>
    </div>

    <noscript><p class="fatal">此面板需要启用 JavaScript。</p></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
